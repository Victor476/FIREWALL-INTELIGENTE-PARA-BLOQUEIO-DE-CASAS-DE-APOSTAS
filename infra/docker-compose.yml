networks:
  firewall_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  gateway:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: firewall-base:latest
    container_name: gateway_firewall
    hostname: gateway-firewall
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      firewall_net:
        ipv4_address: 172.20.0.254
    volumes:
      - ..:/app
      - ../volumes/logs:/app/volumes/logs
      - ../volumes/db:/app/volumes/db
    entrypoint: ["/bin/bash", "/app/infra/entrypoint-gateway.sh"]
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT:-0.5}'
          memory: '${RAM_LIMIT:-812M}'
        reservations:
          cpus: '${CPU_RESERVATION:-0.1}'
          memory: '${RAM_RESERVATION:-128M}'
    stdin_open: true
    tty: true
    command: ["bash"]

  app_client:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: firewall-base:latest
    container_name: app_client
    hostname: app-client
    cap_add:
      - NET_ADMIN
    shm_size: 1g
    networks:
      firewall_net:
        ipv4_address: 172.20.0.10
    depends_on:
      - gateway
    volumes:
      - ..:/app
    entrypoint: ["/bin/bash", "/app/infra/entrypoint-client.sh"]
    stdin_open: true
    tty: true
    command: ["bash"]



